name: Adaptive inference CI

on:
  push:
    branches: [main, feat/adaptive-inference-mvp]
  pull_request:
    branches: [main]

jobs:
  adaptive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src scripts/infer_adaptive.py scripts/benchmark_adaptive.py tests/test_adaptive_inference.py tests/test_adaptive_lora.py
      - name: Adaptive tests
        run: python -m pytest -q tests/test_adaptive_inference.py tests/test_adaptive_lora.py
      - name: Ruff
        run: python -m ruff check src/hagi/inference scripts/infer_adaptive.py scripts/benchmark_adaptive.py tests/test_adaptive_inference.py tests/test_adaptive_lora.py
