name: HAGI self-model experiment

# manual only — no automatic runs, no auto-commits (removed 2026-11-15
# at maintainer request; bot-authored result-publish commits were
# stripped from history in the same change)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hagi-selfmodel-experiment
  cancel-in-progress: false

jobs:
  derive-and-optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/selfmodel-20261115
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal runtime
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run TRACE → DERIVE → OPTIMIZE → GATE
        id: experiment
        continue-on-error: true
        run: python scripts/run_selfmodel_experiment.py
