model:
  vocab_size: 32768
  hidden_size: 128
  num_layers: 3
  loop_depth: 1
  norm_eps: 1.0e-05
  init_orthogonal: true
  attention:
    num_query_heads: 2
    num_kv_heads: 1
    head_dim: 64
    rope_theta: 10000.0
    max_seq_len: 4096
    qk_norm: true
    fp32_softmax: false
    sink_len: 0
  sliding:
    window: 0
    full_every: 4
    history_stride: 0
  embedding:
    tie_lm_head: false
    conv_kernel: 1
    init_std: 0.02
  ffn:
    expansion: 0.5
    multiple_of: 64
  ternary:
    enabled: true
    eps: 1.0e-05
  head:
    unigram_prior: true
    unigram_path: data/unigram.compact.npy
    unigram_smoothing: 1.0
    z_loss_weight: 0.0001
    ce_chunk_rows: 16384
    ce_save_logits: false
    sampled_softmax_k: 2048
    sampled_proposal: prior
    sampled_in_batch_fraction: 0.5
    logit_scale_max: 1.0
  multimodal:
    enabled: false
    n_bridge_queries: 32
    bridge_layers: 2
    bridge_heads: 8
    modality_dropout: 0.3
    grounding_weight: 0.1
    infonce_temperature: 0.07
    variance_gamma: 1.0
merge:
  enabled: false
train:
  max_steps: 250
  batch_size: 8
  grad_accum_steps: 1
  grad_checkpointing: false
  use_muon: false
  ternary_step_cache: true
  ce_keep_rate: 1.0
  ce_keep_mode: stride
  learning_rate: 0.0001
  max_grad_norm: 1.0
  precision: fp32
  compile_model: false
  adam:
    body_lr_scale: 8.0
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.1
  schedule:
    warmup_steps: 1
    decay_fraction: 0.2
    min_lr_ratio: 0.02
  data:
    data_dir: data
    seq_len: 64
    eos_token_id: 1
    pad_token_id: 0
    num_workers: 0
    seed: 20260925
    cross_doc_attention: true
    weights:
      tinystories: 0.5
      python_instruct: 0.5
  logging:
    log_interval: 1
    diag_interval: 1
    diag_chunk_rows: 128
    exact_ce_interval: 1
    exact_ce_rows: 128
  z_loss_weight: 0.0001
  checkpoint_dir: checkpoints/autonomous_bounded_20260925
  checkpoint_interval: 50
  checkpoint_keep_last: 2
  tokenizer: google/gemma-4-E2B-it
  saturation_patience: 0
  saturation_tol: 0.01
  saturation_min_steps: 250
inference:
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  min_new_tokens: 1
  max_new_tokens: 64
  repetition_penalty: 1.05
  repetition_window: 64
