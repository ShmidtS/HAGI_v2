# HAGI-2 (V28) — SmolLM2 teacher configuration (RTX 3070 8GB).
#
# Codec-first scalable multimodal channel LM (see docs/V28_DESIGN.md). Trained
# from scratch on SmolLM2-tokenized data (vocab 49154). A single unified ternary
# BitNet stack with real GQA + an incremental KV-cache; text-only, no MoE, no
# refinement, full attention. The clean from-scratch baseline. Every knob lives
# here (no hardcoded constants in the training loop). Checkpoint format 7.

model:
  vocab_size: 49154
  hidden_size: 384                 # explicit (overrides auto_configure)
  core_hidden_size: 192            # C < H (real compression)
  target_params: 40000000
  target_nonembed_params: 40000000

  attention:
    max_seq_len: 8192
    num_query_heads: 8             # 384 / 8 = 48 per head
    num_kv_heads: 2                # real GQA: 4 query heads share 1 KV head
    head_dim: 48
    rope_theta: 10000.0

  embeddings:
    factor_rank: 128
    kernel_size: 5                  # causal depthwise conv (left-pad only)

  multimodal:
    enabled: false                  # text-only; set true for image/audio

  body:
    num_layers: 12                  # single unified stack (no context/expression split)
    ternary:
      use_ternary: true             # BitNet b1.58 on the 2D body masters
      hebbian_expansion: 4
    bottleneck:
      dim: 192                      # IB latent (C); must be < H
      ib_beta: 0.001                # rate Lagrangian (the only rate notion)
      kl_free_bits: 0.5
      # Iterative IB refinement (CTM-inspired, off by default).
      iterative_ib_enabled: false
      ib_max_iters: 1
      ib_snr_threshold: 0.0
      ib_distortion_epsilon: 0.0
      # Latent memory bank (off by default).
      memory_bank_size: 0
      memory_num_heads: 4
      memory_head_dim: 32
    moe:
      enabled: false                # off for the small text config

train:
  max_steps: 150000
  batch_size: 4
  seq_len: 512
  warmup_steps: 1600
  learning_rate: 0.0003
  grad_accum_steps: 2
  precision: bf16
  muon:
    lr: 0.02

  tokenizer: "HuggingFaceTB/SmolLM2-135M"
  eos_token_id: 0
  pad_token_id: 49152
  data_dir: data

  w_rate: 0.01
  w_distortion: 0.01
  w_route_entropy: 0.0      # no MoE -> no routing entropy
  w_refine: 0.0             # refinement off for the clean baseline
  w_attn_entropy: 0.01
  attn_entropy_floor: 0.5

  checkpoint_dir: checkpoints
  checkpoint_interval: 1000
  checkpoint_keep_last: 3

  curriculum:
    enabled: true
    stage2_start: 120000
    cycles_per_dataset: 3
    stage1_order: [tinystories, python_instruct, smoltalk, wikipedia_en, wikipedia_ru, openwebmath, oscar_ru, slimpajama, edu]
    stage2_datasets: [openwebmath, edu, slimpajama]

  distill:
    enabled: false                  # opt-in online hidden-state distillation
    teacher: "HuggingFaceTB/SmolLM2-360M"
    teacher_hidden_size: 960
    embed_teacher: "HuggingFaceTB/SmolLM2-135M"
    alpha_start: 0.0
    alpha_end: 0.0

inference:
  temperature: 0.8
  top_k: 50
  min_new_tokens: 2
  repetition_penalty: 1.2
  repetition_window: 64
  no_repeat_ngram_size: 2
  max_new_tokens: 64
