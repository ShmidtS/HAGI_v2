# N=12 at the N=6 SIZE: 12 experts of H=192 merged into a joint of H=2304.
#
# The N=7 control showed that widening the model from scratch at this budget
# actively hurts: a 299.0M scratch was 0.4126 nats WORSE than a 241.3M merged
# model. Capacity is not the lever. This lane holds the joint width fixed at
# 2304 -- the same size as N=6 -- and doubles the number of merged
# initializations from 6 to 12.
#
# If merging is what helps, N=12-at-N=6-size should beat N=6-at-the-same-size.
# If it does not, the 0.47 nat merge effect was about capacity after all, and
# the whole growth story needs rethinking.
# N=6 joint model: six domain experts merged into one.
#
# This is the scaling test for the merge result. M (N=3) beat an equal-budget
# scratch arm by 1.99 nats, which established that merging works. What that
# does NOT establish is whether the win GROWS with the number of experts.
#
# Capacity is matched by construction: six experts at hidden 384 concatenate
# into hidden 2304, so the N=6 joint model has the same body size as an N=3
# model built from six-slice experts, and the scratch control for N=6 would be
# a single 2304-wide model at the same joint budget.
#
# Ternary is genuinely enabled (see merge.py: MergedHAGI no longer force-
# disables it, and all prior M2 numbers were produced with it off).
inference:
  max_new_tokens: 512
  min_new_tokens: 1
  repetition_penalty: 1.05
  repetition_window: 128
  temperature: 0.8
  top_k: 50
  top_p: 0.95
merge:
  enabled: true
  expert_checkpoints:
  - checkpoints/n12_e10_e3_math/step-0003000.pt
  - checkpoints/n12_e11_e4_wiki_en/step-0003000.pt
  - checkpoints/n12_e12_e5_tinystory/step-0003000.pt
  - checkpoints/n12_e1_e1_wiki_ru/step-0003000.pt
  - checkpoints/n12_e2_e2_web_en/step-0003000.pt
  - checkpoints/n12_e3_e3_math/step-0003000.pt
  - checkpoints/n12_e4_e4_wiki_en/step-0003000.pt
  - checkpoints/n12_e5_e5_tinystory/step-0003000.pt
  - checkpoints/n12_e6_e6_ru_mix/step-0003000.pt
  - checkpoints/n12_e7_e7_code/step-0003000.pt
  - checkpoints/n12_e8_e1_wiki_ru/step-0003000.pt
  - checkpoints/n12_e9_e2_web_en/step-0003000.pt
  mixer_init_scale: 0.0
  n_experts: 12
model:
  attention:
    head_dim: 64
    max_seq_len: 4096
    num_kv_heads: 12
    num_query_heads: 36
    qk_norm: true
    rope_theta: 10000.0
  embedding:
    conv_kernel: 1
    init_std: 0.02
    tie_lm_head: false
  ffn:
    expansion: 1.0
    # 0 derives the width from ffn.expansion * hidden_size, which is what the
    # experts do (384 each) and what makes the merge block-diagonal. A hard
    # 1536 here broke the merge: the concatenated expert FFNs are 6 * 384 =
    # 2304 wide, and the mixer refused (2304, 2304) against (1536, 2304).
    intermediate_size: 0
    multiple_of: 64
  head:
    ce_chunk_rows: 16384
    ce_save_logits: true
    logit_scale_max: 1.0
    sampled_in_batch_fraction: 0.5
    sampled_proposal: prior
    sampled_softmax_k: 2048
    unigram_path: data/unigram.compact.npy
    unigram_prior: true
    unigram_smoothing: 1.0
    z_loss_weight: 0.0001
  hidden_size: 2304
  init_orthogonal: true
  loop_depth: 1
  multimodal:
    bridge_heads: 8
    bridge_layers: 2
    enabled: false
    grounding_weight: 0.1
    infonce_temperature: 0.07
    modality_dropout: 0.3
    n_bridge_queries: 32
    variance_gamma: 1.0
  norm_eps: 1.0e-05
  num_layers: 3
  sliding:
    full_every: 4
    history_stride: 0
    window: 0
  ternary:
    enabled: true
    eps: 1.0e-05
  vocab_size: 32768
train:
  adam:
    beta1: 0.9
    beta2: 0.95
    body_lr_scale: 8.0
    weight_decay: 0.1
  batch_size: 64
  ce_keep_mode: stride
  ce_keep_rate: 0.25
  checkpoint_dir: checkpoints/n12_joint_s1234
  checkpoint_interval: 1000
  checkpoint_keep_last: 2
  compile_model: false
  data:
    cross_doc_attention: true
    data_dir: data
    eos_token_id: 1
    num_workers: 0
    pad_token_id: 0
    seed: 1234
    seq_len: 128
    weights:
      edu: 0.16666666666666666
      openwebmath: 0.16666666666666666
      oscar_ru: 0.16666666666666666
      python_instruct: 0.16666666666666666
      slimpajama: 0.16666666666666666
      wikipedia_ru: 0.16666666666666666
  grad_accum_steps: 1
  grad_checkpointing: false
  learning_rate: 0.0001
  logging:
    diag_chunk_rows: 512
    diag_interval: 25
    exact_ce_interval: 25
    exact_ce_rows: 512
    log_interval: 25
  max_grad_norm: 1.0
  max_steps: 9000
  precision: bf16
  saturation_min_steps: 9000
  saturation_patience: 200
  saturation_tol: 0.005
  schedule:
    decay_fraction: 0.2
    min_lr_ratio: 0.02
    warmup_steps: 50
  ternary_step_cache: true
  tokenizer: google/gemma-4-E2B-it
  use_muon: false
  z_loss_weight: 0.0001
