# HAGI V41 — in-batch interleaved conditional receiver.
#
# Stack of three rate reductions on the same channel model:
#
#   1. BODY DEPTH L=4 (finite-state cascade length). Activation traffic ∝ L.
#      Measured body-only f+b: L6=882ms → L4=591ms (−33%). full_every=2 keeps
#      two global parity relays in four layers (layers 0,2).
#   2. FULL SUPERVISION p=1.0. The shared receiver makes puncturing save <1%
#      wall-time (1807ms at p=.5 vs 1819ms at p=1), so V40 scores every symbol.
#   3. INTERLEAVED CONDITIONAL NCE K=64. Half the shared bank comes from
#      deterministic in-batch targets (hard source interferers), half from the
#      unigram prior. This improves exact CE for ~0.3% wall-time.
#
# V40 measured end-to-end (8060S, B=30×3 T=1024 bf16):
#   shared NCE p=0.5       1807 ms · 51.0k body tok/s
#   shared NCE p=1.0       1819 ms · 50.7k body tok/s  <- ship
#   exact CE p=1.0         4282 ms · 21.5k body tok/s
# Full supervision costs 0.7% wall-time and halves estimator variance from
# puncturing. exact_ce periodically measures the true coding cost.

model:
  vocab_size: 32768
  hidden_size: 1152
  num_layers: 4
  loop_depth: 1
  norm_eps: 1.0e-5
  init_orthogonal: true

  attention:
    num_query_heads: 18
    num_kv_heads: 3
    head_dim: 64
    rope_theta: 10000.0
    max_seq_len: 4096
    qk_norm: true

  sliding:
    window: 256
    full_every: 2
    history_stride: 4

  embedding:
    tie_lm_head: true
    conv_kernel: 4
    init_std: 0.02

  ffn:
    expansion: 1.33
    multiple_of: 64

  ternary:
    enabled: true
    eps: 1.0e-5

  head:
    unigram_prior: true
    unigram_path: data/unigram.compact.npy
    unigram_smoothing: 1.0
    z_loss_weight: 1.0e-4
    ce_chunk_rows: 16384
    ce_save_logits: true
    # Shared local partition: target + 64 source-prior negatives.
    sampled_softmax_k: 64
    # Match source statistics so frequent interferers are represented.
    sampled_proposal: prior
    sampled_in_batch_fraction: 0.5
    # Local partitions are easier than full-vocabulary decoding; bound gain.
    logit_scale_max: 1.0

  multimodal:
    enabled: false
    n_bridge_queries: 32
    bridge_layers: 2
    bridge_heads: 8
    modality_dropout: 0.3
    grounding_weight: 0.1
    infonce_temperature: 0.07
    variance_gamma: 1.0

train:
  max_steps: 298600
  batch_size: 30
  grad_accum_steps: 3
  grad_checkpointing: false
  use_muon: false
  ternary_step_cache: true
  ce_keep_rate: 1.0
  ce_keep_mode: bernoulli
  learning_rate: 3.0e-4
  max_grad_norm: 1.0
  precision: bf16
  compile_model: false
  adam:
    body_lr_scale: 8.0
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.1
  schedule:
    warmup_steps: 2000
    decay_fraction: 0.2
    min_lr_ratio: 0.02
    inverse_sqrt_stable: false
    inverse_sqrt_tau: 0
  data:
    data_dir: data
    seq_len: 1024
    eos_token_id: 1
    pad_token_id: 0
    num_workers: 2
    seed: 1234
    cross_doc_attention: true

  logging:
    log_interval: 1
    diag_interval: 100
    diag_chunk_rows: 512
    exact_ce_interval: 100
    exact_ce_rows: 512

  z_loss_weight: 1.0e-4
  checkpoint_dir: checkpoints_v41_1b
  checkpoint_interval: 1000
  checkpoint_keep_last: 3
  tokenizer: google/gemma-4-E2B-it

inference:
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  min_new_tokens: 1
  max_new_tokens: 512
  repetition_penalty: 1.05
  repetition_window: 128
