# gen-5 lane, generated by scripts/make_generation.py.
#
# Regenerate with:
#   python scripts/make_generation.py --parent-width 1152 --generation 5 \
#       --n-experts 3 --head-dim 64 \
#       --parent-joint checkpoints/dbridge_gen3_joint/step-0001600.pt \
#       --template-sibling configs/dbridge_gen4_sib1.yaml \
#       --template-merged configs/dbridge_gen4_merged.yaml \
#       --template-joint configs/dbridge_gen4_joint.yaml \
#       --mixes math=13001=openwebmath:0.45,edu:0.25,wikipedia_en:0.10,python_instruct:0.10,tinystories:0.10 \
#               lang=13002=wikipedia_ru:0.30,oscar_ru:0.20,edu:0.20,wikipedia_en:0.15,tinystories:0.15 \
#               code=13003=python_instruct:0.50,edu:0.20,openwebmath:0.10,smoltalk:0.10,wikipedia_en:0.10 \
#       --merge-checkpoint-step 1600 --write
#
# The siblings differ by CORPUS MIX, not only by seed: round 67 measured
# that siblings from one mix converge to the same function plus additive
# noise (CE of the orthogonal residual = ln V), which closes the data
# axis. The generator takes the mixes as explicit arguments and refuses
# weights that do not sum to 1.
#
# Geometry (q*head_dim == hidden_size, enforced by the generator):
#   siblings      H=1152  q=18 kv=9
#   merged/joint  H=3456  q=54 kv=27   (= 3 * 1152, the ternary 3->1 merge)
#   expert_hidden 384
#
# Run:
#   python scripts/growth/growth_supervisor.py --plan configs/growth_gen5.yaml \
#       --device cuda --max-lanes 1
lanes:
  - name: gen5_domain
    experts:
      - configs/dbridge_gen5_sib_math.yaml
      - configs/dbridge_gen5_sib_lang.yaml
      - configs/dbridge_gen5_sib_code.yaml
    joint: configs/dbridge_gen5_merged.yaml
    merge_config: configs/dbridge_gen5_merged.yaml
    domains:
      - math
      - lang
      - code
