model:
  vocab_size: 32768
  hidden_size: 512
  num_layers: 3
  loop_depth: 1
  init_seed: 0
  attention:
    num_query_heads: 8
    num_kv_heads: 4
    head_dim: 64
    max_seq_len: 4096
    rope_theta: 3000.0
    qk_norm: true
    sink_len: 4
  embedding:
    tie_lm_head: false
    conv_kernel: 1
  ternary:
    enabled: false
  ffn:
    expansion: 1.0
  head:
    unigram_prior: false
    sampled_proposal: uniform
  cortex:
    enabled: false
  adapters:
    enabled: false
  decision:
    enabled: false
merge:
  enabled: true
  mixer_type: swiglu
  n_experts: 4
  expert_hidden: 128
  mixer_init_scale: 0.0
  mixer_rank: 64
  freeze_experts: true
  expert_checkpoints:
  - checkpoints/leafdom_dru/step-0000800.pt
  - checkpoints/leafdom_den/step-0000800.pt
  - checkpoints/leafdom_dmath/step-0000800.pt
  - checkpoints/leafdom_dgen/step-0000800.pt
  expert_weight_source: effective_sparse
train:
  max_steps: 400
  checkpoint_interval: 200
  precision: bf16
  ternary_fp32_master: false
  batch_size: 8
  grad_accum_steps: 4
  learning_rate: 0.0001
  checkpoint_dir: checkpoints/flat4dom_rt1
  data:
    data_dir: data
    seq_len: 1024
    seed: 6101
    weights:
      slimpajama: 0.25
      edu: 0.4
      wikipedia_en: 0.1
      wikipedia_ru: 0.08
      oscar_ru: 0.07
      openwebmath: 0.1
  schedule:
    warmup_steps: 40
