# HAGI-2 (V30) — small Strix Halo config (AMD Radeon 8060S, 96GB VRAM).
#
# V30 (2026-07-29): auto-calculated architecture from target_params.
# All hidden sizes, layer counts, head dims, factor ranks derived
# automatically. Only essential overrides listed below.
#
# V29 fixes preserved (IB detach, fp32 IB, bf16-safe logvar, MoE top_k=2).
# Checkpoint format 7. Text-only. Vocab 262144 (gemma).

model:
  vocab_size: 262144
  hidden_size: 512                 # explicit (small net, below auto-calc)
  core_hidden_size: 256            # C < H (real compression)
  target_params: 9000000000
  target_nonembed_params: 9000000000

  attention:
    max_seq_len: 4096
    num_query_heads: 8             # 512/8 = 64 per head
    num_kv_heads: 2                # GQA: 4:1 ratio
    head_dim: 64
    rope_theta: 10000.0

  sliding:
    sliding_window: 512
    full_every: 4

  embeddings:
    factor_rank: 128
    kernel_size: 5

  multimodal:
    enabled: false

  grounded:
    vicreg_gamma: 1.0

  body:
    num_layers: 10
    ternary:
      use_ternary: true
      hebbian_expansion: 4
    bottleneck:
      dim: 256
      ib_beta: 0.001
      # Iterative IB refinement (CTM-inspired, off by default).
      iterative_ib_enabled: false
      ib_max_iters: 1
      ib_snr_threshold: 0.0
      ib_distortion_epsilon: 0.0
      # Latent memory bank (off by default).
      memory_bank_size: 0
      memory_num_heads: 4
      memory_head_dim: 32
    moe:
      enabled: true
      num_experts: 4
      top_k: 2
      n_shared: 1
      moe_every: 2

  refinement:
    enabled: false

train:
  max_steps: 200000
  batch_size: 1
  seq_len: 2048
  warmup_steps: 4000
  learning_rate: 0.0003
  grad_checkpointing: false
  muon:
    lr: 0.01
    momentum_offload: false
    weight_decay: 0.1
  grad_accum_steps: 2
  precision: bf16
  max_grad_norm: 0.5

  tokenizer: "google/gemma-4-E2B-it"
  eos_token_id: 1
  pad_token_id: 0
  data_dir: data

  checkpoint_dir: checkpoints_small
  checkpoint_interval: 1000
  checkpoint_keep_last: 3

  curriculum:
    enabled: true
    stage2_start: 160000
    cycles_per_dataset: 3
    stage1_order: [tinystories, python_instruct, smoltalk, wikipedia_en, wikipedia_ru, openwebmath, oscar_ru, slimpajama, edu]
    stage2_datasets: [openwebmath, edu, slimpajama]

  distill:
    enabled: false

inference:
  temperature: 0.8
  top_k: 50
  min_new_tokens: 2
  repetition_penalty: 1.2
  repetition_window: 64
  no_repeat_ngram_size: 2
  max_new_tokens: 2048
