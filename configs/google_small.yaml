# HAGI-2 (V28) — small Strix Halo speed-test config (AMD Radeon 8060S, 96GB VRAM).
#
# A shrunk copy of google.yaml that preserves EVERY architectural hot-path
# (real GQA, sliding window, water-filling MoE, off-path refinement) so speed
# optimizations validated here transfer to the 9.37B run. Text-only (multimodal
# off) to keep the speed-test focused on the attention/MoE/refinement hot-path
# without needing image/audio batches. Vocab 262144 stays — it reads the same
# gemma-tokenized uint32 .bin shards as google.yaml (SmolLM2's 49154 vocab is
# uint16 and incompatible with the gemma data). Checkpoint format 7.

model:
  vocab_size: 262144
  hidden_size: 512                 # explicit (overrides auto_configure)
  core_hidden_size: 256            # C < H (real compression: 512 -> 256)
  target_params: 200000000
  target_nonembed_params: 200000000

  attention:
    max_seq_len: 2048
    num_query_heads: 8             # 512 / 8 = 64 per head
    num_kv_heads: 2                # real GQA: 4 query heads share 1 KV head (n_rep=4, same ratio as google.yaml)
    head_dim: 64
    rope_theta: 10000.0

  sliding:
    sliding_window: 512            # local O(T*W) channel
    full_every: 4                  # every 4th layer is full attention

  embeddings:
    factor_rank: 128
    kernel_size: 5

  multimodal:
    enabled: false                 # text-only for the speed test

  grounded:
    vicreg_gamma: 1.0

  body:
    num_layers: 8                  # divisible by moe_every=2
    ternary:
      use_ternary: true
      hebbian_expansion: 4
    bottleneck:
      dim: 256
      ib_beta: 0.001
      kl_free_bits: 0.5
    moe:
      enabled: true
      num_experts: 4
      top_k: 1
      n_shared: 1
      moe_every: 2                 # MoE on every 2nd block (4 MoE layers)
      snr_gate_weight: 1.0
      route_entropy_weight: 0.01

  refinement:
    enabled: false                 # OFF for the baseline timing (isolates attention/MoE); flip on to measure its cost
    iterations: 2
    hep_enabled: true
    exit_threshold: 0.05
    exit_min_steps: 50
    exit_window: 5

train:
  max_steps: 200
  batch_size: 1
  seq_len: 2048
  warmup_steps: 20
  learning_rate: 0.0003
  muon_lr: 0.02
  grad_accum_steps: 2
  precision: bf16

  tokenizer: "google/gemma-4-E2B-it"
  eos_token_id: 1
  pad_token_id: 0
  data_dir: data

  w_rate: 0.001
  w_distortion: 1.0
  w_vicreg: 0.1
  w_infonce: 0.1
  w_moe_lb: 0.01
  w_route_entropy: 0.01
  w_water_filling: 0.01
  w_refine: 0.0
  w_attn_entropy: 0.0             # OFF: isolates the GQA lever (no O(T^2) scores transient)
  attn_entropy_floor: 0.0

  checkpoint_dir: checkpoints_small
  checkpoint_interval: 1000
  checkpoint_keep_last: 3

  curriculum:
    enabled: true
    stage2_start: 150
    cycles_per_dataset: 3
    stage1_order: [tinystories, python_instruct, smoltalk, wikipedia_en, wikipedia_ru, openwebmath, oscar_ru, slimpajama, edu]
    stage2_datasets: [openwebmath, edu, slimpajama]

  distill:
    enabled: false                 # teacher not needed for the speed test (distillation is unwired anyway)

inference:
  temperature: 0.8
  top_k: 50
  min_new_tokens: 2
  repetition_penalty: 1.2
  repetition_window: 64
  no_repeat_ngram_size: 2
  max_new_tokens: 64