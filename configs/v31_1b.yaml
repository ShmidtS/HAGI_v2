# HAGI V31 — 1B-scale text model, Gemma-4 tokenizer, AMD Radeon 8060S (96 GB).
#
# Sizing rationale. The V30 predecessor at this vocabulary put 43% of its
# parameters in the embedding table and 88M in the body; it plateaued near
# ce 5 and then diverged. Here the body carries 65% of the total (975M body
# against a 537M table), which is what the transformer needs to actually model
# language rather than memorize a 262k-entry codebook.
#
# The head is tied to the codebook, so V*H is paid once. A factored head was
# measured to leave ~0.5 nats/token of irreducible error at rank 128, which no
# amount of training removes.
#
# Only 176512 of the 262144 ids appear in this corpus and the top 131072 cover
# 99.93% of all mass, so `scripts/compact_vocab.py` can halve the table (537M ->
# 268M, body share 65% -> 78%) before training. See docs/V31_ARCHITECTURE.md.
#
# Before training, generate the unigram prior:
#   python scripts/count_unigram.py --data-dir data
# It hands the model ~4.4 nats/token at step 0 (corpus unigram entropy is
# 8.06 nats against ln V = 12.48). Set head.unigram_prior to false to skip it.

model:
  vocab_size: 262144
  hidden_size: 1024          # ↓ ускорение ~4x CPU/GPU VRAM
  num_layers: 10             # ↓ ускорение ~2x, разумно для CPU/1 GPU
  norm_eps: 1.0e-5

  attention:
    num_query_heads: 8       # 1024 / 8 = 128
    num_kv_heads: 2
    head_dim: 128
    rope_theta: 10000.0
    max_seq_len: 1024        # удлинить при VRAM >12Гб
    qk_norm: true

  sliding:
    window: 256              # ускорить attention. На CPU лучше window меньше, иначе - O(T^2)
    full_every: 2            # relays для долгого контекста

  embedding:
    tie_lm_head: true
    conv_kernel: 4
    init_std: 0.02

  ffn:
    expansion: 2.667
    multiple_of: 64          # чуть экономит память/время, не влияет на качество


  moe:
    enabled: false               # dense at 1B; MoE is the lever for the next scale

  ternary:
    enabled: true                # 1.585 bits/weight — the rate constraint
    eps: 1.0e-5

  head:
    unigram_prior: true
    unigram_path: data/unigram.npy
    unigram_smoothing: 1.0
    z_loss_weight: 1.0e-4
    ce_chunk_rows: 4096          # peak head memory = 4096 * V, not N * V

  multimodal:
    enabled: false

train:
  max_steps: 200000
  batch_size: 2              # ↓ если CUDA OutOfMemory/большой swap
  grad_accum_steps: 2        # 2 × 2 = 4 на шаг, чтобы не страдать от OOM
  data:
    data_dir: data
    seq_len: 512             # ↓ для экономии RAM/VRAM и быстрее dataloader
    eos_token_id: 1
    pad_token_id: 0
    num_workers: 0           # Windows/CPU почти всегда быстрее в однопотоке!
    seed: 1234
    cross_doc_attention: false

  logging:
    log_interval: 1
    diag_interval: 100
    diag_chunk_rows: 512

  z_loss_weight: 1.0e-4
  moe_z_loss_weight: 0.0         # dense

  checkpoint_dir: checkpoints_v31_1b
  checkpoint_interval: 1000
  checkpoint_keep_last: 3
  tokenizer: google/gemma-4-E2B-it

inference:
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  min_new_tokens: 1
  max_new_tokens: 512
  repetition_penalty: 1.05
  repetition_window: 128
