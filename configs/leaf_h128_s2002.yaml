model:
  vocab_size: 32768
  hidden_size: 128
  num_layers: 3
  loop_depth: 2
  init_seed: 2002
  attention:
    num_query_heads: 2
    num_kv_heads: 1
    head_dim: 64
    max_seq_len: 4096
  embedding:
    tie_lm_head: false
    conv_kernel: 1
  ternary:
    enabled: false
  ffn:
    expansion: 1.0
  head:
    unigram_prior: false
    sampled_proposal: uniform
  cortex:
    enabled: false
  adapters:
    enabled: false
  decision:
    enabled: false
train:
  max_steps: 800
  checkpoint_interval: 400
  precision: bf16
  ternary_fp32_master: false
  batch_size: 8
  grad_accum_steps: 4
  learning_rate: 0.0003
  checkpoint_dir: checkpoints/leaf_h128_s2002
  data:
    data_dir: data
    seq_len: 1024
    seed: 2002
    weights:
      slimpajama: 0.25
      edu: 0.4
      wikipedia_en: 0.1
      wikipedia_ru: 0.08
      oscar_ru: 0.07
      openwebmath: 0.1
