# HAGI-2 (V28) — 8B-scale Strix Halo configuration (AMD Radeon 8060S, 96GB VRAM).
#
# Scaled from the 1.26B cloud config to ~9.9B parameters for the unified-memory
# APU (ROCm torch 2.10 / gfx1151). Memory budget is dominated by the PERSISTENT
# optimizer state of the ternary body (Muon momentum bf16 = 4 B/param), not by
# activations — the body is gradient-checkpointed (model._stack_forward) and the
# refinement KL is row-chunked (refinement._kl_main_to_ref). Footprint estimate
# (bf16, B=1, T=8192): persist ~38 GB + grad ~17 GB + peak activations ~6 GB +
# teacher (10.2 GB) + framework ~10 GB headroom ≈ 81 GB, leaving ~15 GB slack
# for the GART spill into system RAM. Checkpoint format 7.

model:
  vocab_size: 262144
  hidden_size: 2048                # explicit (overrides auto_configure)
  core_hidden_size: 1024           # C < H (real compression: 2048 -> 1024)
  target_params: 8000000000        # 8B non-embed budget (auto sizes skipped: all explicit)
  target_nonembed_params: 8000000000

  attention:
    max_seq_len: 8192              # large context window
    num_query_heads: 32            # 2048 / 32 = 64 per head
    num_kv_heads: 8                # real GQA: 4 query heads share 1 KV head
    head_dim: 64
    rope_theta: 500000.0

  sliding:                         # hybrid sliding-window long-context channel
    sliding_window: 1024           # local O(T*W) channel; 0 = full attention
    full_every: 4                  # every 4th layer is full attention (global parity relay)

  embeddings:
    factor_rank: 256
    kernel_size: 5                  # causal depthwise conv (left-pad only)

  multimodal:
    enabled: true                   # image + audio source coding + Q-Former bridge
    image_patch_size: 16
    image_channels: 3
    audio_mel_bins: 80
    n_bridge_queries: 32            # O(1) multimodal prefix regardless of image size
    bridge_layers: 2
    bridge_n_heads: 4               # 2048 / 4 = 512 per bridge head (512 % 4 == 0)

  grounded:
    vicreg_gamma: 1.0               # per-dim std hinge target

  body:
    num_layers: 32                  # single unified stack (divisible by moe_every=2)
    ternary:
      use_ternary: true             # BitNet b1.58 on the 2D body masters
      hebbian_expansion: 4
    bottleneck:
      dim: 1024                     # IB latent (C); must be < H
      ib_beta: 0.001
      kl_free_bits: 0.5
    moe:
      enabled: true                 # water-filling capacity allocation (scalability lever)
      num_experts: 8                # params grow without per-token compute growth
      top_k: 2
      n_shared: 1                   # DeepSeek-Mo shared expert always fires
      moe_every: 2                  # MoE on every 2nd block (16 MoE layers)
      snr_gate_weight: 1.0          # water-filling SNR proxy weight
      route_entropy_weight: 0.01    # routing-entropy capacity maximization

  refinement:                       # off-path HEP predictive refiner (opt-in)
    enabled: true
    iterations: 2
    hep_enabled: true
    exit_threshold: 0.05
    exit_min_steps: 50
    exit_window: 5

train:
  max_steps: 200000
  batch_size: 1                     # micro-batch; effective batch = 1 * 16 = 16
  seq_len: 8192                     # large context window
  warmup_steps: 8000
  learning_rate: 0.00015            # scaled down for ~8B from-scratch
  muon_lr: 0.02
  grad_accum_steps: 16
  precision: bf16

  tokenizer: "google/gemma-4-E2B-it"
  eos_token_id: 1
  pad_token_id: 0
  data_dir: data

  w_rate: 0.001
  w_distortion: 1.0
  w_vicreg: 0.1
  w_infonce: 0.1
  w_moe_lb: 0.01
  w_route_entropy: 0.01            # water-filling dual: maximize routing entropy
  w_water_filling: 0.01
  w_refine: 0.1                    # off-path HEP refinement
  w_attn_entropy: 0.0             # OFF for 8B from-scratch (avoids O(T^2) scores transient)
  attn_entropy_floor: 0.5

  checkpoint_dir: checkpoints
  checkpoint_interval: 2000
  checkpoint_keep_last: 3

  curriculum:
    enabled: true
    stage2_start: 160000
    cycles_per_dataset: 3
    stage1_order: [tinystories, python_instruct, smoltalk, wikipedia_en, wikipedia_ru, openwebmath, oscar_ru, slimpajama, edu]
    stage2_datasets: [openwebmath, edu, slimpajama]

  distill:
    enabled: true                   # online hidden-state distillation from Gemma
    teacher: "google/gemma-4-E2B-it"
    teacher_hidden_size: 1536
    embed_teacher: "google/gemma-4-E2B-it"
    alpha_start: 0.1
    alpha_end: 0.05
    temperature: 2.0
    use_temp_anneal: true
    temp_start: 4.0
    temp_end: 1.0
    end_frac: 0.6

inference:
  temperature: 0.8
  top_k: 50
  min_new_tokens: 2
  repetition_penalty: 1.2
  repetition_window: 64
  no_repeat_ngram_size: 2
  max_new_tokens: 2048             # large generation window (was 128)