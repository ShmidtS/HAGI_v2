# HAGI-2 (V28) — Google Gemma teacher configuration (cloud, T4/V100 16GB).
#
# Codec-first scalable multimodal channel LM (see docs/V28_DESIGN.md). Trained
# from scratch on Gemma-tokenized data (vocab 262146). Larger body budget than
# smollm2.yaml; multimodal source coding (image + audio, 2D/1D-RoPE) with the
# Q-Former bridge, **water-filling MoE** (SNR-gated routing + routing-entropy
# capacity maximization), a hybrid sliding-window long-context channel, and the
# off-path HEP predictive refiner (EXIT-halt gated) enabled — the scalable
# deployment. Checkpoint format 7.

model:
  vocab_size: 262146
  hidden_size: 768                 # explicit (overrides auto_configure)
  core_hidden_size: 384            # C < H (real compression)
  target_params: 400000000
  target_nonembed_params: 400000000

  attention:
    max_seq_len: 8192
    num_query_heads: 12            # 768 / 12 = 64 per head
    num_kv_heads: 3                # real GQA: 4 query heads share 1 KV head
    head_dim: 64
    rope_theta: 500000.0

  sliding:                         # hybrid sliding-window long-context channel
    sliding_window: 1024           # local O(T*W) channel; 0 = full attention
    full_every: 4                  # every 4th layer is full attention (global parity relay)

  embeddings:
    factor_rank: 256
    kernel_size: 5                  # causal depthwise conv (left-pad only)

  multimodal:
    enabled: true                   # image + audio source coding + Q-Former bridge
    image_patch_size: 16
    image_channels: 3
    audio_mel_bins: 80
    n_bridge_queries: 32            # O(1) multimodal prefix regardless of image size
    bridge_layers: 2

  grounded:
    vicreg_gamma: 1.0               # per-dim std hinge target

  body:
    num_layers: 24                  # single unified stack
    ternary:
      use_ternary: true             # BitNet b1.58 on the 2D body masters
      hebbian_expansion: 4
    bottleneck:
      dim: 384                      # IB latent (C); must be < H
      ib_beta: 0.001
      kl_free_bits: 0.5
    moe:
      enabled: true                 # water-filling capacity allocation
      num_experts: 8
      top_k: 2
      n_shared: 1
      moe_every: 2                  # MoE on every 2nd block
      snr_gate_weight: 1.0          # water-filling SNR proxy weight
      route_entropy_weight: 0.01    # routing-entropy capacity maximization

  refinement:                       # off-path HEP predictive refiner (opt-in)
    enabled: true
    iterations: 2
    hep_enabled: true
    exit_threshold: 0.05
    exit_min_steps: 50
    exit_window: 5

train:
  max_steps: 200000
  batch_size: 4
  seq_len: 1024
  warmup_steps: 8000
  learning_rate: 0.0003
  muon_lr: 0.02
  grad_accum_steps: 4
  precision: bf16

  tokenizer: "google/gemma-3-1b-it"
  eos_token_id: 1
  pad_token_id: 0
  data_dir: data

  w_rate: 0.001
  w_distortion: 1.0
  w_vicreg: 0.1
  w_infonce: 0.1
  w_moe_lb: 0.01
  w_route_entropy: 0.01            # water-filling dual: maximize routing entropy
  w_refine: 0.1                    # off-path HEP refinement
  w_attn_entropy: 0.01
  attn_entropy_floor: 0.5

  checkpoint_dir: checkpoints
  checkpoint_interval: 2000
  checkpoint_keep_last: 3

  curriculum:
    enabled: true
    stage2_start: 160000
    cycles_per_dataset: 3
    stage1_order: [tinystories, python_instruct, smoltalk, wikipedia_en, wikipedia_ru, openwebmath, oscar_ru, slimpajama, edu]
    stage2_datasets: [openwebmath, edu, slimpajama]

  distill:
    enabled: true                   # online hidden-state distillation from Gemma
    teacher: "google/gemma-3-1b-it"
    teacher_hidden_size: 1152
    embed_teacher: "google/gemma-3-1b-it"
    alpha_start: 0.1
    alpha_end: 0.05
    temperature: 2.0
    use_temp_anneal: true
    temp_start: 4.0
    temp_end: 1.0
    end_frac: 0.6

inference:
  temperature: 0.8
  top_k: 50
  min_new_tokens: 2
  repetition_penalty: 1.2
  repetition_window: 64
  no_repeat_ngram_size: 2
  max_new_tokens: 128
