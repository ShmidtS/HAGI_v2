model:
  vocab_size: 32768
  hidden_size: 128
  num_layers: 3
  loop_depth: 1
  init_seed: 8201
  attention:
    num_query_heads: 2
    num_kv_heads: 1
    head_dim: 64
    rope_theta: 3000.0
    max_seq_len: 4096
  embedding:
    tie_lm_head: false
    conv_kernel: 1
  ternary:
    enabled: false
  ffn:
    expansion: 1.0
  head:
    z_loss_weight: 0.01
    unigram_prior: true
    logit_scale_max: 2.5
    unigram_path: data/unigram_canon_mix.npy
    sampled_proposal: prior
    sampled_softmax_k: 2048
    fused_ce: true
  cortex:
    enabled: false
  adapters:
    enabled: false
  decision:
    enabled: false
train:
  max_steps: 1600
  checkpoint_interval: 800
  precision: bf16
  ternary_fp32_master: false
  batch_size: 32
  grad_accum_steps: 1
  compile_model: true
  learning_rate: 0.01
  use_muon: true
  zero_init_proj: true
  adam:
    weight_decay: 0.3
  schedule:
    warmup_steps: 40
  checkpoint_dir: checkpoints/nce_anchor_s1
  init_from: checkpoints/leafdat_2xcorp/step-0001600.pt
  data:
    data_dir: data
    seq_len: 1024
    seed: 8301
    weights:
      edu: 0.3571
      slimpajama: 0.2232
      wikipedia_en: 0.0893
      wikipedia_ru: 0.0714
      oscar_ru: 0.0625
      openwebmath: 0.0893
      tinystories: 0.0536
      smoltalk: 0.0536

  nce_anchor_weight: 1.0
  logging:
    exact_ce_interval: 100
    exact_ce_rows: 512
