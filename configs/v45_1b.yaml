# HAGI V45 — unbiased receiver + bandwidth-optimal micro-geometry.
#
# V45 fixes the V44 receiver's self-deception. V44 trained on sampled softmax
# with k=64 negatives from the unigram prior, which is a *biased* estimate of
# the full-alphabet softmax. Measured on the V44 checkpoint: nce=2.30 but
# exact_ce=5.45 — a 3.16 nats/token gap. The model thought it was at 2.3 nats
# while the true coding cost was 5.45. The config was tuned on the biased nce
# metric, not the real exact_ce.
#
# The fix is information-theoretic: raise k to where the bias vanishes and
# puncture the supervision stream (erasure channel) to pay for it. The body
# still processes every symbol (full channel use); the receiver only scores a
# rate-p subset. Measured on the 8060S (stride puncturing, no host gather):
#
#   k=64   keep=1.0   (V44)  36 ms · 681k tok/s · bias 3.13 nats
#   k=2048 keep=0.125 (L=4)  40 ms · 617k tok/s · bias ~0 nats
#   k=2048 keep=0.125 (L=3)  36 ms · 677k tok/s · bias ~0 nats
#   k=2048 keep=0.125 (L=3,conv1) 33 ms · 743k tok/s · bias ~0 nats  <- ship
#
# k=2048 + stride keep=0.125 is the sweet spot: unbiased receiver at +4 ms/step
# over V44. The punctured CE is an unbiased Monte-Carlo estimate of full CE
# under stride sampling (deterministic lattice, phase rotates with the step).
#
# Quality per wall-time (90 s budget, exact_ce after training):
#   L=4 conv4 k2048 : 1760 steps -> exact_ce 6.68
#   L=3 conv1 k2048 : 2674 steps -> exact_ce 6.59   (better, faster)
#
# The bandwidth-bound regime inverts the usual depth/width tradeoff: a small
# wide model that streams tokens faster reaches a better loss in the same
# wall-time than a larger model that is bandwidth-starved. L=3 + conv_k=1
# (no pulse-shaping filter) streams 1.5x more steps and lands a lower exact_ce.
#
# Rejected (measured):
#   * bernoulli puncturing -> host-bound boolean-gather, slower than stride
#   * exact CE (k=0)        -> 282 ms/step, 8x slower (full [N,V] logits)
#   * k=2048 keep=1         -> 70 ms/step, no puncturing benefit
#   * grad_checkpointing    -> 47 ms/step, recompute costs more than saved BW
#   * L=2                   -> 29 ms/step but too shallow, worse exact_ce
#
# Checkpoint format 12; train from scratch (receiver semantics unchanged, but
# the objective is now unbiased so a resume would inherit the old bias).

model:
  vocab_size: 32768
  hidden_size: 128
  num_layers: 3
  loop_depth: 1
  norm_eps: 1.0e-5
  init_orthogonal: true

  attention:
    num_query_heads: 2
    num_kv_heads: 1
    head_dim: 64
    rope_theta: 10000.0
    max_seq_len: 4096
    qk_norm: true

  sliding:
    window: 0
    full_every: 4
    history_stride: 0

  embedding:
    tie_lm_head: false
    conv_kernel: 1
    init_std: 0.02

  ffn:
    expansion: 0.5
    multiple_of: 64

  ternary:
    enabled: true
    eps: 1.0e-5

  head:
    unigram_prior: true
    unigram_path: data/unigram.compact.npy
    unigram_smoothing: 1.0
    z_loss_weight: 1.0e-4
    ce_chunk_rows: 16384
    ce_save_logits: true
    sampled_softmax_k: 2048
    sampled_proposal: prior
    sampled_in_batch_fraction: 0.5
    logit_scale_max: 1.0

  multimodal:
    enabled: false
    n_bridge_queries: 32
    bridge_layers: 2
    bridge_heads: 8
    modality_dropout: 0.3
    grounding_weight: 0.1
    infonce_temperature: 0.07
    variance_gamma: 1.0

train:
  max_steps: 298600
  batch_size: 192
  grad_accum_steps: 1
  grad_checkpointing: false
  use_muon: false
  ternary_step_cache: true
  # Punctured supervision (erasure channel on CE): the body processes every
  # symbol, the receiver scores a rate-p subset. Stride (deterministic lattice,
  # phase rotates with the step) is unbiased and avoids the host-bound
  # boolean-gather that bernoulli incurs on this iGPU.
  ce_keep_rate: 0.125
  ce_keep_mode: stride
  learning_rate: 3.0e-4
  max_grad_norm: 1.0
  precision: bf16
  compile_model: false
  adam:
    body_lr_scale: 8.0
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.1
  schedule:
    warmup_steps: 2000
    decay_fraction: 0.2
    min_lr_ratio: 0.02
    inverse_sqrt_stable: false
    inverse_sqrt_tau: 0
  data:
    data_dir: data
    seq_len: 128
    eos_token_id: 1
    pad_token_id: 0
    num_workers: 2
    seed: 1234
    cross_doc_attention: true

  logging:
    log_interval: 1
    diag_interval: 100
    diag_chunk_rows: 512
    exact_ce_interval: 100
    exact_ce_rows: 512

  z_loss_weight: 1.0e-4
  checkpoint_dir: checkpoints_v45_1b
  checkpoint_interval: 1000
  checkpoint_keep_last: 3
  tokenizer: google/gemma-4-E2B-it

inference:
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  min_new_tokens: 1
  max_new_tokens: 512
  repetition_penalty: 1.05
  repetition_window: 128
