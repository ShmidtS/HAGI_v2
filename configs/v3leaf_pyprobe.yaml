model:
  vocab_size: 32768
  hidden_size: 128
  num_layers: 3
  loop_depth: 1
  init_seed: 8099
  attention:
    num_query_heads: 2
    num_kv_heads: 1
    head_dim: 64
    rope_theta: 3000.0
    max_seq_len: 4096
  embedding:
    tie_lm_head: false
    conv_kernel: 1
  ternary:
    enabled: false
  ffn:
    expansion: 1.0
  head:
    unigram_prior: false
    sampled_proposal: uniform
    fused_ce: true
  cortex:
    enabled: false
  adapters:
    enabled: false
  decision:
    enabled: false
train:
  max_steps: 1600
  checkpoint_interval: 800
  precision: bf16
  ternary_fp32_master: false
  batch_size: 32
  grad_accum_steps: 1
  compile_model: true
  learning_rate: 0.01
  use_muon: true
  zero_init_proj: true
  adam:
    weight_decay: 0.3
  schedule:
    warmup_steps: 40
  checkpoint_dir: checkpoints/v3leaf_pyprobe
  data:
    data_dir: data
    seq_len: 1024
    seed: 8599
    weights:
      edu: 0.3434
      slimpajama: 0.2146
      wikipedia_en: 0.0859
      wikipedia_ru: 0.0687
      oscar_ru: 0.0601
      openwebmath: 0.0859
      tinystories: 0.0515
      smoltalk: 0.0515
      python_instruct: 0.0385
