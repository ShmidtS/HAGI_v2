model:
  vocab_size: 32768
  hidden_size: 1152
  num_layers: 3
  loop_depth: 1
  init_seed: 12301
  attention:
    num_query_heads: 18
    num_kv_heads: 9
    head_dim: 64
    rope_theta: 3000.0
    sink_len: 4
    max_seq_len: 4096
  embedding:
    tie_lm_head: false
    conv_kernel: 1
  ternary:
    enabled: false
  ffn:
    expansion: 1.0
  head:
    unigram_prior: false
    sampled_proposal: uniform
    fused_ce: true
  cortex:
    enabled: false
  adapters:
    enabled: false
  decision:
    enabled: false
train:
  max_steps: 1300
  checkpoint_interval: 1300
  precision: bf16
  grad_checkpointing: false
  ternary_fp32_master: false
  batch_size: 32
  grad_accum_steps: 1
  compile_model: true
  learning_rate: 0.0003
  use_muon: true
  zero_init_proj: false
  adam:
    weight_decay: 0.3
  schedule:
    warmup_steps: 40
  checkpoint_dir: checkpoints/dbridge_bisect_enonly
  init_from: checkpoints/dbridge_gen3_joint/step-0001600.pt
  data:
    data_dir: data
    seq_len: 1024
    seed: 14101
    weights:
      edu: 0.3
      wikipedia_en: 0.3
      smoltalk: 0.2
      tinystories: 0.2
merge:
  enabled: true
  norm_block_dim: 128
  n_mixers: 1
  mixer_type: swiglu
  n_experts: 3
  expert_hidden: 384
  mixer_init_scale: 0.0
  mixer_rank: 64
  freeze_experts: false
  expert_weight_source: effective_sparse
