# Lane plan for the autonomous growth supervisor.
#
# A plain list, so adding a generation is a data edit rather than a code edit.
# Each lane trains its experts from scratch, merges them through the joint
# config, fine-tunes the joint model, and scores it against the previous
# accepted lane.
#
# Lane 1 is the N=6 merge that is currently in flight by hand: six experts at
# hidden 384 merged into a joint model at hidden 2304. Lane 2 grows to N=8 with
# two new domains, which is the first generation where "the model chose to
# grow" can be checked against a lane whose experts were chosen by a person.
lanes:
  - name: n6
    experts:
      - configs/m2_e6_e1_wiki_ru.yaml
      - configs/m2_e6_e2_web_en.yaml
      - configs/m2_e6_e3_math.yaml
      - configs/m2_e6_e4_wiki_en.yaml
      - configs/m2_e6_e5_tinystory.yaml
      - configs/m2_e6_e6_ru_mix.yaml
    joint: configs/m2_e6_joint_s1234.yaml
    note: >
      Six domain experts at hidden 384, merged to a joint model at hidden
      2304 (241.3M params). 3000 steps per expert, 9000 joint steps.

  - name: n7
    experts:
      - configs/m2_e6_e1_wiki_ru.yaml
      - configs/m2_e6_e2_web_en.yaml
      - configs/m2_e6_e3_math.yaml
      - configs/m2_e6_e4_wiki_en.yaml
      - configs/m2_e6_e5_tinystory.yaml
      - configs/m2_e6_e6_ru_mix.yaml
      - configs/m2_e6_e7_code.yaml
    joint: configs/m2_e6_joint_n7_s1234.yaml
    note: >
      Second generation. The seventh expert trains on python_instruct, which
      no other expert uses, so the expert set is no longer a partition of the
      same six corpora. A gain over the n6 incumbent (6.1815) cannot be
      explained as better coverage of the same mix. If it lands inside the
      verdict margin, that is a negative result and is recorded as one.
