# HAGI V35 — bandwidth-optimal dense channel + tuned XM.
#
# V34 measured on the Radeon 8060S iGPU (107 GB/s DDR5): backward = 70% of
# step, B=30->60->90 scales *linearly* (bandwidth-bound), every FLOP-side lever
# (torch.compile +4%, grad-ckpt -19%, fp8/int8 unsupported on ROCm) is a
# dead end. The iGPU's memory bandwidth is the channel; FLOPs are free.
#
# V35 therefore shrinks the *memory traffic* per step, not the FLOPs:
#
#   * L=13 -> L=8, H=1152 fixed. Measured 11647 -> 15920 tok/s (+37%). The
#     body's activation traffic is ~per-layer, so fewer layers = less data
#     moved per step. H=1536 (wider) measured 2x slower — bandwidth, not
#     capacity, is the bottleneck.
#   * batch 30 -> 90 (grad_accum 3 x 30). tok/s 15910 -> 16465 (+3.5%):
#     larger GEMMs amortize launch overhead; tok/s plateaus at B>=60.
#   * head.ce_save_logits=True. Measured -12% head time (825ms -> 730ms):
#     keeps the tied [V,H] codebook full-rank (V31 rejected rank-r factoring,
#     which caps ce at a +1.42 nats KL floor), but caches chunked logits in
#     VRAM instead of recomputing the [N,V] projection in backward. VRAM is
#     free here (0.9GB used of ~115GB).
#   * use_muon=False. Newton-Schulz orthogonalization measured +7% step time
#     for zero measured benefit on the ternary body (the quantizer reads only
#     the sign pattern; AdamW body_lr_scale rebalances gradient scales at a
#     fraction of NS cost).
#   * XM best-of-K is fixed but opt-in. V34's implementation silently never
#     explored: entropy_gate was measured against ln(V)=12.48 while the
#     unigram prior caps posterior entropy at ~8.06 nats, so no position could
#     pass the gate. Now gated against the unigram entropy + capped by
#     explore_fraction. On this bandwidth-bound iGPU K candidate head passes
#     still cost +32% step time, so XM is off by default; enable it when
#     quality-per-token matters more than throughput.
#
# Parameters (analytic): H=1152 L=8, 18q/3kv x 64, ffn=1536 (exp 1.33),
#   body=67M embed=37.7M total=105M. ~36% fewer body params than V34 but
#   +37% tokens/sec — the bandwidth-bound regime trades depth for tokens.
#
# Quality guard: L=8 vs L=13 at fixed tokens is a real capacity cut. The
# WSD schedule and dense channel are unchanged; the run's ce trajectory vs
# the V34 log will show the trade. If ce plateaus above V34, the fix is
# NOT more depth (bandwidth-bound) but a wider H at L=8 (measured 2x
# slower) — so the intended knob is longer training, not shape.

model:
  vocab_size: 32768
  hidden_size: 1152
  num_layers: 8
  norm_eps: 1.0e-5
  init_orthogonal: true

  attention:
    num_query_heads: 18
    num_kv_heads: 3
    head_dim: 64
    rope_theta: 10000.0
    max_seq_len: 4096
    qk_norm: true

  sliding:
    window: 512
    full_every: 4

  embedding:
    tie_lm_head: true
    conv_kernel: 4
    init_std: 0.02

  ffn:
    expansion: 1.33
    multiple_of: 64

  moe:
    enabled: false
    num_experts: 8
    top_k: 1
    n_shared: 0
    moe_every: 2
    bias_update_rate: 0.001
    router_init_std: 0.0
    z_loss_weight: 1.0e-3

  spectral:
    enabled: false
    num_modes: 32
    every: 4
    block_len: 64
    freq_base: 0.02
    freq_max: 3.0
    damp_min: 0.90
    damp_max: 0.999
    ramp_steps: 20000
    out_channels: 0
    use_2d: true

  ternary:
    enabled: true
    eps: 1.0e-5

  head:
    unigram_prior: true
    unigram_path: data/unigram.compact.npy
    unigram_smoothing: 1.0
    z_loss_weight: 1.0e-4
    ce_chunk_rows: 8192
    ce_save_logits: true

  multimodal:
    enabled: false

  xm:
    enabled: false            # opt-in: +32% step time on this bandwidth-bound
                              # iGPU (K candidate head passes). Gate is now
                              # correct (explore_fraction caps the ambiguous
                              # tail; entropy_gate is vs the achievable unigram
                              # entropy, not ln V), so enabling it actually
                              # explores instead of silently no-oping as in V34.
    num_modes: 3
    entropy_gate: 0.9
    explore_fraction: 0.2     # top 20% of ambiguous positions only (budget cap)
    mode_std: 0.1             # larger than V34's 0.05 so candidates diverge
    min_modes: 1

train:
  max_steps: 298600
  batch_size: 30
  grad_accum_steps: 3
  grad_checkpointing: false
  use_muon: false
  schedule:
    inverse_sqrt_stable: false
    inverse_sqrt_tau: 0
  data:
    data_dir: data
    seq_len: 1024
    eos_token_id: 1
    pad_token_id: 0
    num_workers: 0
    seed: 1234
    cross_doc_attention: false

  logging:
    log_interval: 1
    diag_interval: 100
    diag_chunk_rows: 512

  z_loss_weight: 1.0e-4
  moe_z_loss_weight: 1.0e-3

  checkpoint_dir: checkpoints_v35_1b
  checkpoint_interval: 1000
  checkpoint_keep_last: 3
  tokenizer: google/gemma-4-E2B-it

inference:
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  min_new_tokens: 1
  max_new_tokens: 512
  repetition_penalty: 1.05
  repetition_window: 128
