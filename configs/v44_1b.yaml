# HAGI V44 — bandwidth-optimal micro-geometry for the Radeon 8060S iGPU.
#
# V44 is the result of a measured wall-time sweep (not guessed). The V43
# config (H=768, L=4, ffn=1.0, T=128, B=192) was already a local optimum for
# its geometry, but a fresh sweep across hidden_size at fixed T=128/B=192
# revealed the model is BANDWIDTH-BOUND, not launch-bound: every reduction in
# H cuts GEMM bytes moved through DDR5 (~107 GB/s) and raises tok/s
# monotonically.
#
#   H=768  L=4  ffn=1.0  T=128  B=192  (V43)  237 ms · 103.6k tok/s
#   H=512  L=4  ffn=1.0  T=128  B=192         160 ms · 153.6k
#   H=384  L=4  ffn=1.0  T=128  B=192         109 ms · 225.6k
#   H=256  L=4  ffn=1.0  T=128  B=192          75 ms · 327.4k
#   H=192  L=4  ffn=1.0  T=128  B=192          55 ms · 448.3k
#   H=128  L=4  ffn=1.0  T=128  B=192  (V44)   39 ms · 629.9k  <- ship
#
# Quality per wall-time (equal ~65 s budget, nce after training):
#   H=768  L=4  x200  steps  56.7 s -> nce 3.50
#   H=128  L=4  x1400 steps  64.0 s -> nce 2.66   (0.84 nats better)
#
# The bandwidth-bound regime inverts the usual depth/width tradeoff: a small
# wide model that streams tokens 6x faster reaches a better loss in the same
# wall-time than a large model that is bandwidth-starved. This is the classic
# "small model, more steps" result, and it is decisive here.
#
# Rejected (all measured slower per wall-time):
#   * ffn=0.5 / L=3 at H=768  -> slower (launch-bound, not FLOPs-bound)
#   * torch.compile           -> 262 ms vs 234 ms (ROCm codegen not optimal)
#   * grad_checkpointing      -> 297 ms (recompute costs more than saved BW)
#   * B=384 / B=96            -> B=192 is the tok/s sweet spot
#   * T=256 / T=512           -> flash-attn backward ∝ T² dominates
#   * head_dim=64             -> no change (not flash-attn-bound at T=128)
#   * tie_lm_head=True        -> 3.13 vs 3.06 nce (tied head gather is slower)
#   * loop_depth=2            -> 3.06 vs 2.66 nce (fewer unique steps)
#   * L=6 / L=8 at H=128      -> fewer steps per wall-time, worse nce
#
# Punctured receiver (ce_keep_rate=0.5) is DISABLED: on this host-bound iGPU
# the boolean-gather (nonzero+index) cost ~188 ms CPU/step, more than the ~2%
# head compute it saves. rate=1.0 scores every token and is faster.
#
# Checkpoint format 12; train from scratch.

model:
  vocab_size: 32768
  hidden_size: 128
  num_layers: 4
  loop_depth: 1
  norm_eps: 1.0e-5
  init_orthogonal: true

  attention:
    num_query_heads: 2
    num_kv_heads: 1
    head_dim: 64
    rope_theta: 10000.0
    max_seq_len: 4096
    qk_norm: true

  sliding:
    window: 0
    full_every: 4
    history_stride: 0

  embedding:
    tie_lm_head: false
    conv_kernel: 4
    init_std: 0.02

  ffn:
    expansion: 1.0
    multiple_of: 64

  ternary:
    enabled: true
    eps: 1.0e-5

  head:
    unigram_prior: true
    unigram_path: data/unigram.compact.npy
    unigram_smoothing: 1.0
    z_loss_weight: 1.0e-4
    ce_chunk_rows: 16384
    ce_save_logits: true
    sampled_softmax_k: 64
    sampled_proposal: prior
    sampled_in_batch_fraction: 0.5
    logit_scale_max: 1.0

  multimodal:
    enabled: false
    n_bridge_queries: 32
    bridge_layers: 2
    bridge_heads: 8
    modality_dropout: 0.3
    grounding_weight: 0.1
    infonce_temperature: 0.07
    variance_gamma: 1.0

train:
  max_steps: 298600
  batch_size: 192
  grad_accum_steps: 1
  grad_checkpointing: false
  use_muon: false
  ternary_step_cache: true
  # Puncturing disabled: the boolean-gather host cost exceeds the head savings
  # on this bandwidth-bound iGPU. Score every token.
  ce_keep_rate: 1.0
  ce_keep_mode: bernoulli
  learning_rate: 3.0e-4
  max_grad_norm: 1.0
  precision: bf16
  compile_model: false
  adam:
    body_lr_scale: 8.0
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.1
  schedule:
    warmup_steps: 2000
    decay_fraction: 0.2
    min_lr_ratio: 0.02
    inverse_sqrt_stable: false
    inverse_sqrt_tau: 0
  data:
    data_dir: data
    seq_len: 128
    eos_token_id: 1
    pad_token_id: 0
    num_workers: 2
    seed: 1234
    cross_doc_attention: true

  logging:
    log_interval: 1
    diag_interval: 100
    diag_chunk_rows: 512
    exact_ce_interval: 100
    exact_ce_rows: 512

  z_loss_weight: 1.0e-4
  checkpoint_dir: checkpoints_v44_1b
  checkpoint_interval: 1000
  checkpoint_keep_last: 3
  tokenizer: google/gemma-4-E2B-it

inference:
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  min_new_tokens: 1
  max_new_tokens: 512
  repetition_penalty: 1.05
  repetition_window: 128
