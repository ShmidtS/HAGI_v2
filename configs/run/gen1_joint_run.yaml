model:
  vocab_size: 32768
  hidden_size: 384
  num_layers: 3
  loop_depth: 1
  init_seed: 8401
  attention:
    num_query_heads: 6
    num_kv_heads: 3
    head_dim: 64
    rope_theta: 3000.0
    sink_len: 4
    max_seq_len: 4096
  embedding:
    tie_lm_head: false
    conv_kernel: 1
  ternary:
    enabled: false
  ffn:
    expansion: 1.0
  head:
    unigram_prior: false
    sampled_proposal: uniform
    fused_ce: true
  cortex:
    enabled: false
  adapters:
    enabled: false
  decision:
    enabled: false
train:
  max_steps: 1600
  checkpoint_interval: 800
  precision: bf16
  grad_checkpointing: false
  ternary_fp32_master: false
  batch_size: 32
  grad_accum_steps: 1
  compile_model: true
  learning_rate: 0.001
  use_muon: true
  zero_init_proj: false
  adam:
    weight_decay: 0.3
  schedule:
    warmup_steps: 40
  checkpoint_dir: checkpoints/dbridge_gen1_joint
  init_from: checkpoints/dbridge_gen1_merged/step-0000000.pt
  data:
    data_dir: data
    seq_len: 1024
    seed: 9901
    weights:
      edu: 0.3571
      python_instruct: 0.2232
      wikipedia_en: 0.0893
      wikipedia_ru: 0.0714
      oscar_ru: 0.0625
      openwebmath: 0.0893
      tinystories: 0.0536
      smoltalk: 0.0536
  ce_keep_rate: 0.5
  ce_keep_mode: bernoulli
merge:
  enabled: true
  norm_block_dim: 128
  n_mixers: 1
  mixer_type: swiglu
  n_experts: 3
  expert_hidden: 128
  mixer_init_scale: 0.0
  mixer_rank: 64
  freeze_experts: false
  expert_weight_source: effective_sparse
