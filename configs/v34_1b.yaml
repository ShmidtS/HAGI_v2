# HAGI V34 — Explorative Modeling (XM) on the V33 speed-tuned dense channel.
#
# V33 is bandwidth-bound on the Radeon 8060S iGPU: 12.4k tok/s at batch 30,
# backward = 71% of step, and every speed lever (fuse, ternary, batch, seq,
# H/L, grad-ckpt, torch.compile) moves it 0-6%. The iGPU's 107 GB/s DDR5 caps
# per-step throughput; more parameters or batch do not scale it.
#
# V34 therefore optimises *quality per step*, not speed per step, using
# Explorative Modeling (Gladstone, Ji, Du — arxiv 2607.27372):
#
#   Forward XM: fix a data target, draw K candidates from the model's own
#   generations, train on the one closest to the target (best-of-K).
#
#   This scales *generative expressivity* (how many modes a prediction can
#   commit to) which is fixed at design time by the generation factorization in
#   every standard autoregressive recipe. On a bandwidth-bound part where FLOPs
#   are cheap relative to memory traffic, exploration is almost free: each
#   extra candidate costs 1/3 of a training step (forward-only), and only the
#   best candidate's gradient is kept (Algorithm 1).
#
# Theory (Proposition 1, Appendix F): at large K, Forward XM is maximum
# likelihood of a K-component mixture of the explored candidates, recovering
# the data distribution up to a Gaussian blur of width sigma. K=1 is ordinary
# MLE. Gains grow with scale: 4.1x FLOP, 6.2x sample, 47% param efficiency.
#
# Implementation (per XMDLM, Appendix C): K learnable discrete latent
# embeddings. Each candidate samples one embedding per position, the LM head
# predicts from the *best* candidate's context, only its CE gradient is kept.
# In this text-only autoregressive setting we apply best-of-K at the token
# level on high-uncertainty positions (entropy gate), which is where list
# decoding buys the most: spending the exploration budget where the conditional
# distribution is genuinely multimodal.
#
# V34 removes from V33: nothing (same speed core). Adds: XM head/mixer gates.
#
# Parameters (analytic): H=1152 L=13, 18q/3kv x 64, ffn=1536 (exp 1.33),
#   body=109M embed=37.7M total=147M (same as V33).

model:
  vocab_size: 32768
  hidden_size: 1152
  num_layers: 13
  norm_eps: 1.0e-5
  init_orthogonal: true

  attention:
    num_query_heads: 18
    num_kv_heads: 3
    head_dim: 64
    rope_theta: 10000.0
    max_seq_len: 4096
    qk_norm: true

  sliding:
    window: 512
    full_every: 4

  embedding:
    tie_lm_head: true
    conv_kernel: 4
    init_std: 0.02

  ffn:
    expansion: 1.33
    multiple_of: 64

  moe:
    enabled: false
    num_experts: 8
    top_k: 1
    n_shared: 0
    moe_every: 2
    bias_update_rate: 0.001
    router_init_std: 0.0
    z_loss_weight: 1.0e-3

  spectral:
    enabled: false
    num_modes: 32
    every: 4
    block_len: 64
    freq_base: 0.02
    freq_max: 3.0
    damp_min: 0.90
    damp_max: 0.999
    ramp_steps: 20000
    out_channels: 0
    use_2d: true

  ternary:
    enabled: true
    eps: 1.0e-5

  head:
    unigram_prior: true
    unigram_path: data/unigram.compact.npy
    unigram_smoothing: 1.0
    z_loss_weight: 1.0e-4
    ce_chunk_rows: 8192
    ce_save_logits: true

  multimodal:
    enabled: false

  xm:
    enabled: false          # best-of-K list decoding; off by default — measured
                            # ~equal loss at +11% step time on the bandwidth-bound
                            # iGPU (mode_codes too similar to the base prediction
                            # to diverge). Enable for a quality study on a
                            # compute-bound GPU where extra forwards are cheaper.
    num_modes: 4
    entropy_gate: 0.9
    mode_std: 0.05
    min_modes: 1

train:
  max_steps: 298600
  batch_size: 30
  grad_accum_steps: 1
  grad_checkpointing: false
  use_muon: true
  schedule:
    inverse_sqrt_stable: false
    inverse_sqrt_tau: 0
  data:
    data_dir: data
    seq_len: 1024
    eos_token_id: 1
    pad_token_id: 0
    num_workers: 0
    seed: 1234
    cross_doc_attention: false

  logging:
    log_interval: 1
    diag_interval: 100
    diag_chunk_rows: 512

  z_loss_weight: 1.0e-4
  moe_z_loss_weight: 1.0e-3

  checkpoint_dir: checkpoints_v34_1b
  checkpoint_interval: 1000
  checkpoint_keep_last: 3
  tokenizer: google/gemma-4-E2B-it

inference:
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  min_new_tokens: 1
  max_new_tokens: 512
  repetition_penalty: 1.05
  repetition_window: 128
