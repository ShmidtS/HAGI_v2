# HAGI V43 — bandwidth-optimal geometry, host-bound fix, punctured receiver.
#
# V43 rethinks V42 for wall-time on a bandwidth-bound iGPU (Radeon 8060S,
# DDR5 ~107 GB/s). Profiling (torch.profiler, with_stack) showed the model is
# HOST-BOUND, not compute-bound: aten::copy_ = 634 ms CPU (65.7% of step time)
# from BitLinear rebuilding the ternary map per forward. Two fixes:
#
#   1. CACHED STE (host-bound fix). BitLinear now caches the quantized
#      effective weight once per optimizer step and the forward returns it
#      through a zero-copy _CachedSTE (no `weight + (q-weight).detach()`
#      materialization). The ternary cache is now always on (was gated on
#      grad_accum>1). Removes ~150 host copies/step.
#
#   2. GEOMETRY SWEEP (measured, not guessed). Backward dominates (534 ms of
#      750 ms = 71%): flash-attention backward 202 ms + GEMM backward 150 ms.
#      Backward ∝ L (layers) and GEMM ∝ H²·L·ffn. Sweep at fixed body budget:
#
#        H=512  L=8  ffn=2.0  T=1024  B=48   (V42)  791 ms · 62.1k tok/s
#        H=768  L=4  ffn=2.0  T=1024  B=48         701 ms · 70.1k
#        H=768  L=4  ffn=1.0  T=1024  B=48         593 ms · 82.9k
#        H=768  L=4  ffn=1.0  T=512   B=48         276 ms · 89.0k
#        H=768  L=4  ffn=1.0  T=256   B=96         252 ms · 97.5k
#        H=768  L=4  ffn=1.0  T=128   B=192  (V43) 237 ms · 103.8k  <- ship
#
#   T=128 cuts flash-attention backward ∝ T². B=192 keeps tokens/step high
#   (192×1×128 = 24 576) and tok/s rises with B (103k→107k at B=384) but
#   ms/step grows faster; B=192 is the sweet spot (3.2 GiB peak).
#
#   Quality (ce after 60 steps, equal token budget): V42 3.920 → V43 3.907.
#   The shallower/wider body learns at least as well at 3.3× the speed.
#
#   3. PUNCTURED RECEIVER (kept from V42). ce_keep_rate=0.5 scores half the
#      positions. At T=128 the head is cheap (~3 ms), so puncturing saves only
#      ~2% wall-time, but it is theoretically principled (erasure channel on
#      supervision — the body still processes every symbol) and reduces
#      gradient variance. Backward puncturing through the body was measured
#      and does NOT pay off: detaching non-scored positions does not cut the
#      attention/GEMM backward (227 vs 223 ms), and a two-pass forward costs
#      more than it saves at small T.
#
  # Punctured receiver (ce_keep_rate=0.5) is DISABLED: on this host-bound iGPU
  # the boolean-gather (nonzero+index) cost ~188 ms CPU/step, more than the ~2%
  # head compute it saves. rate=1.0 scores every token and is faster.
  #
  # Checkpoint format 12; train from scratch.

model:
  vocab_size: 32768
  hidden_size: 768
  num_layers: 4
  loop_depth: 1
  norm_eps: 1.0e-5
  init_orthogonal: true

  attention:
    num_query_heads: 6
    num_kv_heads: 2
    head_dim: 128
    rope_theta: 10000.0
    max_seq_len: 4096
    qk_norm: true

  sliding:
    # W=0: all layers use full causal flash attention. One optimized SDPA
    # kernel per layer — faster than chunked windowed paths on this iGPU.
    window: 0
    full_every: 4
    history_stride: 0

  embedding:
    tie_lm_head: false
    conv_kernel: 4
    init_std: 0.02

  ffn:
    # ffn=1.0 (no expansion): 3 matrices of H×H. Backward ∝ ffn, so the
    # narrowest mixer is the fastest. Measured 593 ms (ffn=1.0) vs 646 ms
    # (ffn=1.33) vs 628 ms (ffn=1.5) at H=768 L=4 T=1024.
    expansion: 1.0
    multiple_of: 64

  ternary:
    enabled: true
    eps: 1.0e-5

  head:
    unigram_prior: true
    unigram_path: data/unigram.compact.npy
    unigram_smoothing: 1.0
    z_loss_weight: 1.0e-4
    ce_chunk_rows: 16384
    ce_save_logits: true
    sampled_softmax_k: 64
    sampled_proposal: prior
    sampled_in_batch_fraction: 0.5
    logit_scale_max: 1.0

  multimodal:
    enabled: false
    n_bridge_queries: 32
    bridge_layers: 2
    bridge_heads: 8
    modality_dropout: 0.3
    grounding_weight: 0.1
    infonce_temperature: 0.07
    variance_gamma: 1.0

train:
  max_steps: 298600
  # T=128, B=192: flash-attention backward ∝ T² is 64× cheaper than V42's
  # T=1024. Tokens/step = 192×1×128 = 24 576. The model is too small to
  # exploit longer context (ce identical at T=128/256/512), so short T is
  # pure win. grad_accum=1: the ternary cache is now always on.
  batch_size: 192
  grad_accum_steps: 1
  grad_checkpointing: false
  use_muon: false
  ternary_step_cache: true
  # Punctured CE: score 50% of positions (Bernoulli erasure channel on
  # supervision). Body still sees full T; only the receiver cost is thinned.
  # DISABLED (rate=1.0): measured on this host-bound iGPU the boolean-gather
  # (nonzero+index) costs ~188 ms CPU/step, more than the ~2% head compute it
  # saves. Scoring every token is faster and doubles the scored-token count.
  ce_keep_rate: 1.0
  ce_keep_mode: bernoulli
  learning_rate: 3.0e-4
  max_grad_norm: 1.0
  precision: bf16
  compile_model: false
  adam:
    body_lr_scale: 8.0
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.1
  schedule:
    warmup_steps: 2000
    decay_fraction: 0.2
    min_lr_ratio: 0.02
    inverse_sqrt_stable: false
    inverse_sqrt_tau: 0
  data:
    data_dir: data
    seq_len: 128
    eos_token_id: 1
    pad_token_id: 0
    num_workers: 2
    seed: 1234
    cross_doc_attention: true

  logging:
    log_interval: 1
    diag_interval: 100
    diag_chunk_rows: 512
    exact_ce_interval: 100
    exact_ce_rows: 512

  z_loss_weight: 1.0e-4
  checkpoint_dir: checkpoints_v43_1b
  checkpoint_interval: 1000
  checkpoint_keep_last: 3
  tokenizer: google/gemma-4-E2B-it

inference:
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  min_new_tokens: 1
  max_new_tokens: 512
  repetition_penalty: 1.05
  repetition_window: 128
