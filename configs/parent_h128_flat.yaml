model:
  vocab_size: 32768
  hidden_size: 384
  num_layers: 3
  loop_depth: 2
  init_seed: 0
  attention:
    num_query_heads: 6
    num_kv_heads: 3
    head_dim: 64
    max_seq_len: 4096
  embedding:
    tie_lm_head: false
    conv_kernel: 1
  ternary:
    enabled: false
  ffn:
    expansion: 1.0
  head:
    unigram_prior: false
    sampled_proposal: uniform
  cortex:
    enabled: false
  adapters:
    enabled: false
  decision:
    enabled: false
merge:
  enabled: true
  mixer_type: hadamard
  n_experts: 3
  expert_hidden: 128
  mixer_init_scale: 0.0
  mixer_rank: 64
  freeze_experts: false
  expert_checkpoints:
  - checkpoints/leaf_h128_s1001/step-0000800.pt
  - checkpoints/leaf_h128_s1002/step-0000800.pt
  - checkpoints/leaf_h128_s1003/step-0000800.pt
train:
  max_steps: 800
  checkpoint_interval: 400
  precision: bf16
  ternary_fp32_master: false
  batch_size: 8
  grad_accum_steps: 4
  learning_rate: 0.0003
  checkpoint_dir: checkpoints/parent_h128_flat
  data:
    data_dir: data
    seq_len: 1024
    seed: 1001
    weights:
      slimpajama: 0.25
      edu: 0.4
      wikipedia_en: 0.1
      wikipedia_ru: 0.08
      oscar_ru: 0.07
      openwebmath: 0.1
