# HAGI V33 — ternary dense channel on top of V32.
#
# What V33.5 changes for speed (measured, batch 30 seq 1024, Radeon 8060S):
#
# 1. **MoE removed.** E=8 top_k=1 activates 1/8 of experts but the dispatch
#    overhead + 8 separate small matmuls make it *slower* than dense (measured
#    1670 vs 1541ms at I=1.33) while 2.3x the parameters. On this ROCm part the
#    small-matmul utilization penalty eats the MoE FLOP saving. Dense gives the
#    same 60-step loss drop at 147M params vs 263M.
# 2. **Spectral branch removed.** 3 layers * ~15ms overhead, quality-neutral at
#    this scale (dense L=13 without it beats MoE+spectral: drop 1.663 vs 1.648).
# 3. **ffn expansion 2.33 -> 1.33.** -43% ffn FLOP, -37% params. SwiGLU at 1.33H
#    still beats MoE's capacity at this width.
# 4. **num_layers 9 -> 13 dense.** Depth is the scaling axis without dispatch
#    overhead; L=13 at I=1.33 (147M) runs at 2039ms vs the old MoE 2254ms (-10%)
#    and reaches a *lower* 60-step loss (1.663 vs 1.648).
#
# Head bf16 backward, grad_weight transpose, NS hybrid, chunk 8192 are in code.
#
# Throughput: ~15100 tok/s at batch 30 (was ~13600), 147M params.

model:
  vocab_size: 32768            # compacted
  hidden_size: 1152
  num_layers: 13               # dense depth (MoE removed)
  norm_eps: 1.0e-5
  init_orthogonal: true        # CDMA precoding: full-rank orthogonal 2D weights

  attention:
    num_query_heads: 18        # 1152 / 18 = 64
    num_kv_heads: 3            # GQA, 6x KV-cache saving
    head_dim: 64
    rope_theta: 10000.0
    max_seq_len: 4096
    qk_norm: true

  sliding:
    window: 512
    full_every: 4

  embedding:
    tie_lm_head: true
    conv_kernel: 4
    init_std: 0.02

  ffn:
    expansion: 1.33              # 2.33 -> 1.33: -43% ffn FLOP, -37% params
    multiple_of: 64

  moe:
    enabled: false              # removed: dispatch overhead beats dense at top1
    num_experts: 8
    top_k: 1
    n_shared: 0
    moe_every: 2
    bias_update_rate: 0.001
    router_init_std: 0.0
    z_loss_weight: 1.0e-3

  spectral:
    enabled: false              # removed: ~45ms/step, quality-neutral at this scale
    num_modes: 32
    every: 4
    block_len: 64
    freq_base: 0.02
    freq_max: 3.0
    damp_min: 0.90
    damp_max: 0.999
    ramp_steps: 20000
    out_channels: 0
    use_2d: true

  ternary:
    enabled: true
    eps: 1.0e-5

  head:
    unigram_prior: true
    unigram_path: data/unigram.compact.npy
    unigram_smoothing: 1.0
    z_loss_weight: 1.0e-4
    ce_chunk_rows: 8192
    ce_save_logits: true

  multimodal:
    enabled: false

train:
  max_steps: 298600
  batch_size: 30               # 15 -> 30: +5% throughput (overhead amortized)
  grad_accum_steps: 1
  grad_checkpointing: false
  use_muon: true               # CDMA precoding: orthogonalized updates for 2D channel weights
  schedule:
    inverse_sqrt_stable: false  # const stable phase; inverse_sqrt tau=2000 decays LR 2-11x below peak
    inverse_sqrt_tau: 0
  data:
    data_dir: data
    seq_len: 1024
    eos_token_id: 1
    pad_token_id: 0
    num_workers: 0
    seed: 1234
    cross_doc_attention: false

  logging:
    log_interval: 1
    diag_interval: 100
    diag_chunk_rows: 512

  z_loss_weight: 1.0e-4
  moe_z_loss_weight: 1.0e-3

  checkpoint_dir: checkpoints_v33_1b
  checkpoint_interval: 1000
  checkpoint_keep_last: 3
  tokenizer: google/gemma-4-E2B-it

inference:
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  min_new_tokens: 1
  max_new_tokens: 512
  repetition_penalty: 1.05
  repetition_window: 128
