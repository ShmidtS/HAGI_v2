[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hagi"
version = "1.0.0"
description = "HAGI — ternary RD-channel causal language model (BitNet b1.58)"
requires-python = ">=3.12"
dependencies = ["numpy", "torch>=2.0", "pyyaml", "gigatoken"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
